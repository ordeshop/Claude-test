<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ordé Fly-over</title>
<style>
  @font-face { font-family: 'Geist'; src: url(fonts/geist-500-latin.woff2) format('woff2'); font-weight: 500; font-display: block; }
  @font-face { font-family: 'Instrument Serif'; src: url(fonts/instrument-serif-italic-latin.woff2) format('woff2'); font-style: italic; font-display: block; }
  html, body { margin: 0; background: #f6f7f9; overflow: hidden; }
  #stage { position: relative; width: 1440px; height: 1152px; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 1440px; height: 1152px; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  .badge { position: absolute; top: 44px; left: 50%; display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 999px; padding: 7px 20px 7px 7px;
    font: 500 21px/1 'Geist', sans-serif; color: #1f3a30; letter-spacing: -0.01em;
    box-shadow: 0 1px 2px rgba(26,33,51,.06), 0 6px 18px rgba(26,33,51,.06); }
  .badge img { width: 32px; height: 32px; border-radius: 9px; display: block; }
  .line { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
  .l1 { top: 104px; font: 500 74px/1 'Geist', sans-serif; letter-spacing: -0.035em; color: #17201c; }
  .l2 { top: 176px; font: italic 400 82px/1 'Instrument Serif', serif; letter-spacing: -0.01em; color: #8b8b92; }
  .w { display: inline-block; margin: 0 0.12em; }
  .etile { position: absolute; left: 0; top: 0; border-radius: 22%; overflow: hidden; }
  .etile img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1440" height="1152"></canvas>
  <div id="ov">
    <div class="badge" id="badge"><img src="../assets/logo-tile.png" alt=""><span id="brand"></span></div>
    <div class="line l1" id="l1"></div>
    <div class="line l2" id="l2"></div>
  </div>
</div>
<script src="timeline.js"></script>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const CFG = {
  brand: Q.get('brand') || 'Ordé',
  line1: Q.get('line1') || 'Erst sehen, dann entscheiden.',
  tail: Q.get('tail') || 'kostenlos.',
  subframes: +(Q.get('sub') || 16),
  shutter: 0.7,
  fps: 60,
};
const W = 1440, HS = 1152;
const FLOOR_MID = [0xf9, 0xfb, 0xfb].map(v => v / 255);
const FLOOR_EDGE = [0xf2, 0xf3, 0xf6].map(v => v / 255);
const HAZE = [0.968, 0.976, 0.980];
const SHADOW = [0x1a, 0x21, 0x33].map(v => v / 255);

const gl = document.getElementById('gl').getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, premultipliedAlpha: true, alpha: false });
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('EXT_color_buffer_half_float');
const ANISO = gl.getExtension('EXT_texture_filter_anisotropic');

// ---------------------------------------------------------------- shaders
const VS_QUAD = `#version 300 es
precision highp float;
in vec2 aC;
uniform vec3 uO, uU, uV;          // quad origin and half axes, page space
uniform vec2 uUVScale;
uniform vec2 uHalfPx;             // half size in page px (for masks)
uniform vec4 uPageRect;           // page tile: x0,y0,x1,y1 in page px
uniform vec3 uCamPos, uFwd, uUp, uRight;
uniform float uF;
out vec2 vUV; out vec2 vLocal; out vec2 vPage; out float vDepth;
void main(){
  vec3 p = uO + aC.x*uU + aC.y*uV;
  vec3 d = p - uCamPos;
  float z = dot(d, uFwd);
  float x = dot(d, uRight), y = dot(d, uUp);
  gl_Position = vec4(x*2.0*uF/1440.0, y*2.0*uF/1152.0, z - 20.0, z);
  vUV = 0.5 + aC*0.5*uUVScale;
  vLocal = aC*uHalfPx;
  vPage = mix(uPageRect.xy, uPageRect.zw, aC*0.5+0.5);
  vDepth = z;
}`;

const FS_QUAD = `#version 300 es
precision highp float;
in vec2 vUV; in vec2 vLocal; in vec2 vPage; in float vDepth;
uniform sampler2D uTex;
uniform int uMode;                // 0 textured, 1 piece shadow, 2 solid, 3 page shadow, 4 page tile, 5 logo tile, 6 tile shadow
uniform float uOpacity, uFade, uLod, uRadius;
uniform vec2 uBlurUV, uHalfPx;
uniform vec3 uColor, uHaze;
uniform vec4 uMask;               // page mask rect x0,y0,x1,y1
uniform float uMaskR, uHeroY, uBelowFade, uShadowBlur;
layout(location=0) out vec4 oColor;
layout(location=1) out vec4 oDepth;
float sdRound(vec2 p, vec2 c, vec2 h, float r){ vec2 q = abs(p-c) - h + r; return length(max(q,0.0)) + min(max(q.x,q.y),0.0) - r; }
vec4 fadeToHaze(vec4 c, float f){
  // fade into the haze colour first, only then to transparent
  vec3 rgb = c.a > 0.0 ? c.rgb / c.a : c.rgb;
  rgb = mix(rgb, uHaze, clamp(f*1.6, 0.0, 1.0));
  float a = c.a * (1.0 - smoothstep(0.62, 1.0, f));
  return vec4(rgb*a, a);
}
void main(){
  vec4 c;
  if (uMode == 0) {
    c = texture(uTex, vUV);
    c = fadeToHaze(c, uFade);
  } else if (uMode == 1) {
    float a = 0.0;
    for (int i = 0; i < 7; i++) {
      float ang = float(i) * 0.897598;
      vec2 uv = i == 6 ? vUV : vUV + vec2(cos(ang), sin(ang)) * uBlurUV;
      vec2 inside = step(vec2(0.0), uv) * step(uv, vec2(1.0));
      a += textureLod(uTex, uv, uLod).a * inside.x * inside.y;
    }
    a /= 7.0;
    a *= uOpacity * (1.0 - uFade);
    c = vec4(uColor*a, a);
  } else if (uMode == 6) {
    // logo tiles are opaque squares: their shadow is a soft rounded rect
    float sd = sdRound(vLocal, vec2(0.0), uHalfPx - uShadowBlur, uRadius);
    float a = uOpacity * (1.0 - uFade) * (1.0 - smoothstep(-uShadowBlur*0.5, uShadowBlur*0.5, sd));
    c = vec4(uColor*a, a);
  } else if (uMode == 2) {
    float a = uOpacity * (1.0 - smoothstep(0.62, 1.0, uFade));
    c = vec4(mix(uColor, uHaze, clamp(uFade*1.6,0.0,1.0))*a, a);
  } else if (uMode == 3) {
    vec2 h = (uMask.zw - uMask.xy) * 0.5;
    float sd = sdRound(vPage, (uMask.xy + uMask.zw)*0.5, h, uMaskR);
    float a = uOpacity * (1.0 - smoothstep(-uShadowBlur*0.6, uShadowBlur, sd));
    c = vec4(uColor*a, a);
  } else if (uMode == 4) {
    c = texture(uTex, vUV);
    vec2 h = (uMask.zw - uMask.xy) * 0.5;
    float sd = sdRound(vPage, (uMask.xy + uMask.zw)*0.5, h, uMaskR);
    float aa = fwidth(sd);
    float m = clamp(0.5 - sd/max(aa,1e-4), 0.0, 1.0);
    float below = uBelowFade * smoothstep(uHeroY, uHeroY + 30.0, vPage.y);
    c = fadeToHaze(c, below) * m;
  } else {
    c = texture(uTex, vUV);
    float sd = sdRound(vLocal, vec2(0.0), uHalfPx, uRadius);
    float aa = fwidth(sd);
    c *= clamp(0.5 - sd/max(aa,1e-4), 0.0, 1.0);
    c = fadeToHaze(c, uFade);
  }
  oColor = c;
  oDepth = vec4(vDepth*c.a, 0.0, 0.0, c.a);
}`;

const VS_FULL = `#version 300 es
in vec2 aC; out vec2 vP;
void main(){ vP = aC*0.5+0.5; gl_Position = vec4(aC, 0.0, 1.0); }`;

const FS_FLOOR = `#version 300 es
precision highp float;
in vec2 vP;
uniform vec3 uCamPos, uFwd, uUp, uRight, uMid, uEdge;
uniform float uF;
layout(location=0) out vec4 oColor;
layout(location=1) out vec4 oDepth;
void main(){
  vec2 px = vec2(vP.x*1440.0, (1.0-vP.y)*1152.0);
  vec2 q = (px - vec2(720.0, 576.0)) / vec2(720.0, 576.0);
  float r = clamp(length(q) / 1.4142, 0.0, 1.0);
  vec3 col = mix(uMid, uEdge, smoothstep(0.0, 1.0, r));
  vec3 dir = uRight*(px.x-720.0) + uUp*(576.0-px.y) + uFwd*uF;
  float depth = 6.0e4;
  if (dir.z < -1e-4) { float s = -uCamPos.z / dir.z; depth = s*uF; }
  oColor = vec4(col, 1.0);
  oDepth = vec4(depth, 0.0, 0.0, 1.0);
}`;

// colour + signed circle of confusion into one mipmapped texture
const FS_PREP = `#version 300 es
precision highp float;
in vec2 vP;
uniform sampler2D uCol, uDep;
uniform float uFocus;
out vec4 o;
void main(){
  vec4 c = texture(uCol, vP); c.rgb /= max(c.a, 1e-5);
  vec4 dd = texture(uDep, vP);
  float d = dd.r / max(dd.a, 1e-4);
  float coc = d < uFocus ? 75.0*(uFocus-d)/d : -6.0*(d-uFocus)/d;
  coc = clamp(coc, -120.0, 120.0);
  o = vec4(c.rgb, 0.5 + coc/250.0);
}`;

const FS_DOF = `#version 300 es
precision highp float;
in vec2 vP;
uniform sampler2D uP;
uniform float uSpin;
out vec4 o;
float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
float coc(float a){ return (a - 0.5)*250.0; }
void main(){
  vec2 res = vec2(1440.0, 1152.0);
  vec4 c0 = texture(uP, vP);
  float s0 = coc(c0.a);
  float r = abs(s0);
  vec3 col = c0.rgb;
  if (r > 0.6) {
    int n = r < 4.0 ? 12 : (r < 12.0 ? 24 : 40);
    float fn = float(n);
    float lod = clamp(log2(r*sqrt(3.14159/fn)), 0.0, 6.0);
    vec3 sum = c0.rgb; float ws = 1.0;
    for (int i = 0; i < 40; i++) {
      if (i >= n) break;
      float rho = r*sqrt((float(i)+0.5)/fn);
      float ang = float(i)*2.39996323 + uSpin;
      vec2 uv = vP + vec2(cos(ang), sin(ang))*rho/res;
      vec4 t = textureLod(uP, uv, lod);
      float st = coc(t.a);
      // a sharp tap in front of a blurred pixel must not bleed into it
      float w = st > s0 + 1.0 ? clamp(abs(st) - rho + 1.0, 0.0, 1.0) : 1.0;
      sum += t.rgb*w; ws += w;
    }
    col = sum/ws;
  }
  o = vec4(col + (h(gl_FragCoord.xy) - 0.5)/255.0, 1.0);
}`;

const FS_ACC = `#version 300 es
precision highp float;
in vec2 vP;
uniform sampler2D uA;
uniform float uWeight;
out vec4 o;
void main(){ o = vec4(texture(uA, vP).rgb, 1.0) * uWeight; }`;

function compile(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.bindAttribLocation(p, 0, 'aC');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
const P = {
  quad: compile(VS_QUAD, FS_QUAD), floor: compile(VS_FULL, FS_FLOOR), prep: compile(VS_FULL, FS_PREP),
  dof: compile(VS_FULL, FS_DOF), acc: compile(VS_FULL, FS_ACC),
};

const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// ---------------------------------------------------------------- targets
function tex(w, h, internal, format, type, mips) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  if (mips) gl.texStorage2D(gl.TEXTURE_2D, Math.floor(Math.log2(Math.max(w, h))) + 1, internal, w, h);
  else gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function fbo(...texs) {
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  texs.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
  gl.drawBuffers(texs.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if (st !== gl.FRAMEBUFFER_COMPLETE) throw new Error('fbo ' + st);
  return f;
}
const T_COL = tex(W, HS, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
const T_DEP = tex(W, HS, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT);
const T_PREP = tex(W, HS, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, true);
const T_ACC = tex(W, HS, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT);
const F_SCENE = fbo(T_COL, T_DEP), F_PREP = fbo(T_PREP), F_ACC = fbo(T_ACC);

// ---------------------------------------------------------------- assets
function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(src)); i.src = src; });
}
function imageTexture(img) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (ANISO) gl.texParameterf(gl.TEXTURE_2D, ANISO.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(16, gl.getParameter(ANISO.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  return t;
}

let LAYOUT, TL, PAGE_TILES = [], PIECES = [], LOGO_TEX;

async function init() {
  LAYOUT = await (await fetch('capture/layout.json')).json();
  TL = Timeline.make(LAYOUT);
  const imgs = await Promise.all([
    ...LAYOUT.tiles.map(t => loadImage('capture/' + t.file)),
    ...LAYOUT.pieces.map(p => loadImage('capture/' + p.file)),
    loadImage('../assets/logo-tile.png'),
  ]);
  let k = 0;
  PAGE_TILES = LAYOUT.tiles.map(t => ({ ...t, tex: imageTexture(imgs[k++]) }));
  PIECES = LAYOUT.pieces.map(p => ({ ...p, tex: imageTexture(imgs[k++]) }));
  LOGO_TEX = imageTexture(imgs[k++]);
  buildOverlay();
  await document.fonts.ready;
  window.READY = true;
}

// ---------------------------------------------------------------- drawing
let CAM;
function setCam(prog) {
  const u = prog.u;
  gl.uniform3fv(u.uCamPos, CAM.pos); gl.uniform3fv(u.uFwd, CAM.fwd); gl.uniform3fv(u.uUp, CAM.up);
  gl.uniform3fv(u.uRight, CAM.right); gl.uniform1f(u.uF, TL.F);
}
function quad(o) {
  const u = P.quad.u;
  gl.uniform1i(u.uMode, o.mode);
  gl.uniform3fv(u.uO, o.O); gl.uniform3fv(u.uU, o.U); gl.uniform3fv(u.uV, o.V);
  gl.uniform2fv(u.uUVScale, o.uvScale || [1, 1]);
  gl.uniform2fv(u.uHalfPx, o.halfPx || [1, 1]);
  gl.uniform4fv(u.uPageRect, o.pageRect || [0, 0, 1, 1]);
  gl.uniform1f(u.uOpacity, o.opacity ?? 1);
  gl.uniform1f(u.uFade, o.fade || 0);
  gl.uniform1f(u.uLod, o.lod || 0);
  gl.uniform1f(u.uRadius, o.radius || 0);
  gl.uniform2fv(u.uBlurUV, o.blurUV || [0, 0]);
  gl.uniform3fv(u.uColor, o.color || [1, 1, 1]);
  // always bind something real: unit 0 may still hold a render target from the last pass
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, o.tex || LOGO_TEX); gl.uniform1i(u.uTex, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// A lifted piece standing up by angle a about its own horizontal middle.
function standing(cx, cy, z, hw, hh, a) {
  return { O: [cx, cy, z], U: [hw, 0, 0], V: [0, hh * Math.cos(a), -hh * Math.sin(a)] };
}
function shadowOf(cx, cy, z, hw, hh, a, tex, texPxPerPage, fade) {
  const blur = 7 + 0.5 * z;
  const sx = cx + 0.10 * z, sy = cy + 4 + 0.36 * z;
  const fh = hh * Math.cos(a);
  const ex = (hw + 2 * blur) / hw, ey = (fh + 2 * blur) / fh;
  const blurTex = blur * texPxPerPage;
  return { mode: 1, O: [sx, sy, 0.05], U: [hw * ex, 0, 0], V: [0, fh * ey, 0], uvScale: [ex, ey],
    tex, color: SHADOW, opacity: 0.26, fade,
    lod: Math.max(0, Math.log2(Math.max(1, blurTex * 0.45))),
    blurUV: [blur * 0.6 / (2 * hw), blur * 0.6 / (2 * fh)] };
}

function drawScene(t) {
  CAM = TL.camera(t);
  gl.bindFramebuffer(gl.FRAMEBUFFER, F_SCENE);
  gl.viewport(0, 0, W, HS);
  gl.disable(gl.BLEND);

  // floor
  gl.useProgram(P.floor.p); setCam(P.floor);
  gl.uniform3fv(P.floor.u.uMid, FLOOR_MID); gl.uniform3fv(P.floor.u.uEdge, FLOOR_EDGE);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(P.quad.p); setCam(P.quad);
  const u = P.quad.u;
  gl.uniform3fv(u.uHaze, HAZE);
  const H = LAYOUT.height;
  const k = TL.F / CAM.D;                       // screen px per page px at the look point
  const mask = [0, 0, W, CAM.maskBottom];
  gl.uniform4fv(u.uMask, mask);
  gl.uniform1f(u.uMaskR, CAM.radius);
  gl.uniform1f(u.uHeroY, TL.HERO_BOTTOM);
  gl.uniform1f(u.uBelowFade, CAM.belowFade);

  // soft wide shadow around the page
  const sb = Math.max(70, 26 / k), off = Math.max(18, 8 / k);
  gl.uniform1f(u.uShadowBlur, sb);
  quad({ mode: 3, O: [W / 2, mask[3] / 2 + off, 0.01], U: [W / 2 + sb * 2, 0, 0], V: [0, mask[3] / 2 + sb * 2, 0],
    pageRect: [-sb * 2, -sb * 2 + off, W + sb * 2, mask[3] + sb * 2 + off], color: SHADOW, opacity: 0.10 });
  gl.uniform4fv(u.uMask, mask);

  // the page, in tiles
  for (const tile of PAGE_TILES) {
    if (tile.y > mask[3]) continue;
    quad({ mode: 4, tex: tile.tex, O: [W / 2, tile.y + tile.h / 2, 0], U: [W / 2, 0, 0], V: [0, tile.h / 2, 0],
      pageRect: [0, tile.y, W, tile.y + tile.h] });
  }

  // everything that floats, with its state at t
  const items = [];
  for (const p of PIECES) {
    const s = TL.pieceState(p, t);
    if (s.fade >= 1) continue;
    const hw = (p.w + 2 * p.pad) / 2, hh = (p.h + 2 * p.pad) / 2;
    items.push({ z: s.z, p, s, hw, hh, cx: p.x + p.w / 2 + s.dx, cy: p.y + p.h / 2 });
  }
  for (const tl of TL.tiles(t)) if (tl.fade < 1) items.push({ z: tl.c[2], tile: tl });

  // shadows first, they lie on the page
  for (const it of items) {
    if (it.p) {
      if (it.z < 1) continue;
      quad(shadowOf(it.cx, it.cy, it.z, it.hw, it.hh, it.s.angle, it.p.tex, LAYOUT.dpr, it.s.fade));
    } else {
      const tl = it.tile, h = tl.size / 2, z = tl.c[2], blur = 7 + 0.5 * z, fh = h * Math.cos(tl.angle);
      gl.uniform1f(u.uShadowBlur, blur);
      quad({ mode: 6, O: [tl.c[0] + 0.10 * z, tl.c[1] + 4 + 0.36 * z, 0.05], U: [h + blur, 0, 0], V: [0, fh + blur, 0],
        halfPx: [h + blur, fh + blur], radius: Math.min(h, fh) * 0.44, color: SHADOW, opacity: 0.26, fade: tl.fade });
    }
  }
  // then the pieces, lowest first, no depth buffer
  items.sort((a, b) => a.z - b.z);
  for (const it of items) {
    if (it.p) {
      const { s, hw, hh, cx, cy } = it;
      if (s.thick > 0.5) {
        // the card's white edge, showing as it stands up
        const a = s.angle, hb = it.p.h / 2, n = [0, Math.sin(a), Math.cos(a)];
        const B = [cx, cy + hb * Math.cos(a), s.z - hb * Math.sin(a)];
        quad({ mode: 2, O: [B[0] - n[0] * s.thick / 2, B[1] - n[1] * s.thick / 2, B[2] - n[2] * s.thick / 2],
          U: [it.p.w / 2 - 6, 0, 0], V: [n[0] * s.thick / 2, n[1] * s.thick / 2, n[2] * s.thick / 2],
          color: [0.93, 0.94, 0.95], opacity: 1, fade: s.fade });
      }
      quad({ mode: 0, tex: it.p.tex, ...standing(cx, cy, s.z, hw, hh, s.angle), fade: s.fade });
    } else {
      const tl = it.tile, h = tl.size / 2;
      quad({ mode: 5, tex: LOGO_TEX, ...standing(tl.c[0], tl.c[1], tl.c[2], h, h, tl.angle),
        halfPx: [h, h], radius: tl.size * 0.22, fade: tl.fade });
    }
  }
  gl.disable(gl.BLEND);
}

function accumulate(weight) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, F_ACC);
  gl.useProgram(P.acc.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T_COL); gl.uniform1i(P.acc.u.uA, 0);
  gl.uniform1f(P.acc.u.uWeight, weight);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.disable(gl.BLEND);
}

function depthOfField(spin) {
  // colour + signed coc, mipmapped, then a golden-angle gather to the canvas
  gl.bindFramebuffer(gl.FRAMEBUFFER, F_PREP);
  gl.useProgram(P.prep.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T_ACC); gl.uniform1i(P.prep.u.uCol, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, T_DEP); gl.uniform1i(P.prep.u.uDep, 1);
  gl.uniform1f(P.prep.u.uFocus, CAM.focus);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T_PREP); gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.useProgram(P.dof.p);
  gl.uniform1i(P.dof.u.uP, 0);
  gl.uniform1f(P.dof.u.uSpin, spin);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// How far (screen px) the picture moves during the shutter: decides how many
// subframes are needed so motion blur stays smooth (never more than CFG.subframes).
function shutterMotion(t, span) {
  const pts = [[200, 0], [1240, 0], [200, 1], [1240, 1], [720, 0.5]];
  const c0 = TL.camera(Math.max(0, t - span / 2)), c1 = TL.camera(Math.min(14.5, t + span / 2));
  let m = 0;
  for (const [sx, sy] of pts) {
    const y = sy * HS;
    const p0 = TL.project(c0, TL.unproject(c0, sx, y, c0.D));
    const p1 = TL.project(c1, TL.unproject(c0, sx, y, c0.D));
    m = Math.max(m, Math.hypot(p1.x - p0.x, p1.y - p0.y));
  }
  return m;
}

// ---------------------------------------------------------------- overlay
const OV = {};
function buildOverlay() {
  document.getElementById('brand').textContent = CFG.brand;
  const words = (el, text) => text.split(/\s+/).filter(Boolean).map(w => {
    const s = document.createElement('span'); s.className = 'w'; s.textContent = w; el.appendChild(s); return s;
  });
  OV.l1 = words(document.getElementById('l1'), CFG.line1);
  OV.l2 = words(document.getElementById('l2'), CFG.tail);
  OV.badge = document.getElementById('badge');
  // end-card tiles: two on the card's top corners, two huge soft ones at the bottom corners
  OV.tiles = [
    { x: 226, y: 300, size: 86, blur: 2.2, from: [-40, -30], t0: 9.78 },
    { x: 1218, y: 292, size: 104, blur: 0, from: [40, -34], t0: 9.82 },
    { x: 120, y: 1080, size: 380, blur: 38, from: [-260, 220], t0: 9.70 },
    { x: 1330, y: 1050, size: 440, blur: 46, from: [280, 240], t0: 9.74 },
  ].map(d => {
    const el = document.createElement('div'); el.className = 'etile';
    el.innerHTML = '<img src="../assets/logo-tile.png" alt="">';
    document.getElementById('ov').appendChild(el);
    return { ...d, el };
  });
}
function overlay(t) {
  const { ss, mix } = Timeline;
  const b = ss(10.02, 10.32, t);
  OV.badge.style.opacity = b;
  OV.badge.style.transform = `translate(-50%, ${mix(8, 0, b)}px)`;
  const word = (el, t0) => {
    const e = ss(t0, t0 + 0.34, t);
    el.style.opacity = e;
    el.style.transform = `translateY(${mix(16, 0, e)}px)`;
    el.style.filter = e < 1 ? `blur(${mix(12, 0, e).toFixed(2)}px)` : 'none';
  };
  OV.l1.forEach((el, i) => word(el, 10.12 + i * 0.06));
  OV.l2.forEach((el, i) => word(el, 10.36 + i * 0.05));
  for (const d of OV.tiles) {
    const e = ss(d.t0, d.t0 + 0.55, t);
    const drift = Math.sin((t - 10) * 0.9 + d.x * 0.01) * 4 * ss(10.2, 11, t);
    const x = d.x + mix(d.from[0], 0, e), y = d.y + mix(d.from[1], 0, e) + drift;
    const blur = d.blur + mix(10, 0, e) * (d.size < 200 ? 1 : 0.2);
    d.el.style.width = d.el.style.height = d.size + 'px';
    d.el.style.transform = `translate(${x - d.size / 2}px, ${y - d.size / 2}px) scale(${mix(0.82, 1, e)})`;
    d.el.style.opacity = e;
    d.el.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';
  }
}

// ---------------------------------------------------------------- seek
window.seek = function (t, sub) {
  const max = sub || CFG.subframes;
  const span = CFG.shutter / CFG.fps;
  const n = Math.max(1, Math.min(max, Math.ceil(shutterMotion(t, span) / 1.2)));
  gl.bindFramebuffer(gl.FRAMEBUFFER, F_ACC);
  gl.viewport(0, 0, W, HS);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  // subframes across the shutter; the one nearest t goes last so its depth drives the focus
  const order = [...Array(n).keys()].sort((a, b) => Math.abs(b + 0.5 - n / 2) - Math.abs(a + 0.5 - n / 2));
  for (const i of order) {
    const ti = n > 1 ? t + ((i + 0.5) / n - 0.5) * span : t;
    drawScene(Math.max(0, Math.min(14.5, ti)));
    accumulate(1 / n);
  }
  CAM = TL.camera(t);
  depthOfField(0.37);
  overlay(t);
  const px = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  window.LAST_SUBFRAMES = n;
  return CAM.stage + ' sub=' + n;
};

init().catch(e => { window.INIT_ERROR = String(e && e.stack || e); console.error(e); });
</script>
